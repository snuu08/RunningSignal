[build]
command = "npm run build"
publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_APP_MODE = "real"
  SIGNAL_PUBLIC_PREDICTION = "false"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
included_files = ["data/signals/verified/**"]

[functions."api"]
  timeout = 26

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/index.html"
[headers.values]
  Cache-Control = "no-cache"

# Keep the rewrite so the SPA fallback does not swallow /api.
# The function also declares path /api/* for runtimes that honor it.
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
